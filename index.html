<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP & FTTH Field Survey App</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f0f2f5;
    }
    .container {
      max-width: 650px;
      margin: auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #1a365d;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 22px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: #2d3748;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #fff;
    }
    select:focus {
      border-color: #3182ce;
      outline: none;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }
    .section {
      background: #ebf8ff;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      border-left: 5px solid #3182ce;
    }
    .section-ftth {
      background: #f0fff4;
      border-left-color: #38a169;
    }
    .section h3 {
      margin-top: 0;
      font-size: 16px;
      color: #2c5282;
      margin-bottom: 14px;
    }
    .section-ftth h3 {
      color: #22543d;
    }
    .hidden {
      display: none;
    }
    button {
      width: 100%;
      background-color: #38a169;
      color: white;
      font-weight: bold;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 25px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #2f855a;
    }
    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    .loading-text {
      text-align: center;
      color: #4a5568;
      font-weight: 600;
      padding: 20px;
    }
    .alert-msg {
      color: #e53e3e;
      text-align: center;
      font-weight: bold;
      margin: 20px 0;
      padding: 12px;
      background: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>AP & FTTH Survey Application</h2>

  <div id="loader" class="loading-text">⌛ Master Data Load Ho Raha Hai, kripya prateeksha karein...</div>

  <div id="mainForm" class="hidden">
    <!-- Location Dropdowns -->
    <div class="form-group">
      <label for="districtSelect">1. District Select Karein:</label>
      <select id="districtSelect" onchange="onDistrictChange()" required>
        <option value="">-- Choose District --</option>
      </select>
    </div>

    <div class="form-group hidden" id="blockDiv">
      <label for="blockSelect">2. Block Select Karein:</label>
      <select id="blockSelect" onchange="onBlockChange()" required>
        <option value="">-- Choose Block --</option>
      </select>
    </div>

    <div class="form-group hidden" id="gpDiv">
      <label for="gpSelect">3. Gram Panchayat Select Karein:</label>
      <select id="gpSelect" onchange="onGPChange()" required>
        <option value="">-- Choose Gram Panchayat --</option>
      </select>
    </div>

    <!-- Dynamic Form Sections -->
    <form id="surveyForm" class="hidden" onsubmit="submitSurvey(event)">
      
      <!-- AP Survey Section -->
      <div id="apSection" class="section hidden">
        <h3>📡 Access Point Survey (Installed)</h3>
        <div class="form-group">
          <label>1) Access Point - Pole Installed?</label>
          <select id="ap_pole" required>
            <option value="">-- Select --</option>
            <option value="YES">YES</option>
            <option value="NO">NO</option>
          </select>
        </div>
        <div class="form-group">
          <label>2) Access Point Installed?</label>
          <select id="ap_inst" required>
            <option value="">-- Select --</option>
            <option value="YES">YES</option>
            <option value="NO">NO</option>
          </select>
        </div>
        <div class="form-group">
          <label>3) Solar Installed?</label>
          <select id="solar_inst" required>
            <option value="">-- Select --</option>
            <option value="YES">YES</option>
            <option value="NO">NO</option>
          </select>
        </div>
        <div class="form-group">
          <label>4) CCU Installed?</label>
          <select id="ccu_inst" required>
            <option value="">-- Select --</option>
            <option value="YES">YES</option>
            <option value="NO">NO</option>
          </select>
        </div>
        <div class="form-group">
          <label>5) Battery Installed?</label>
          <select id="batt_inst" required>
            <option value="">-- Select --</option>
            <option value="YES">YES</option>
            <option value="NO">NO</option>
          </select>
        </div>
      </div>

      <!-- FTTH Survey Section -->
      <div id="ftthSection" class="section section-ftth hidden">
        <h3>🌐 FTTH Router Survey</h3>
        <div id="ftthSubscribersList"></div>
      </div>

      <div id="noSurveyMsg" class="alert-msg hidden">
        ⚠️ Is Gram Panchayat me AP aur FTTH dono "NOT INSTALLED" hain. Survey ki aavashyakta nahi hai.
      </div>

      <button type="submit" id="submitBtn" class="hidden">Submit Survey Response</button>
    </form>
  </div>
</div>

      .then(data => {
